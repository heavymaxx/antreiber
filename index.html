<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Innere Antreiber - Test (Transaktionsanalyse)</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-bg-subtle: #fafafa;
      --text: #1e293b;
      --text-muted: #64748b;
      --text-heading: #0f172a;
      --border: #e2e8f0;
      --card-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.03);
      --selected-bg: #eff6ff;
      --selected-border: #2563eb;
      --selected-text: #2563eb;
      --permission-bg: #eff6ff;
      --permission-border: #2563eb;
      --permission-text: #1e3a8a;
      --chart-grid: #f1f5f9;
      --chart-tick: #64748b;
      --badge-high-bg: #fee2e2;
      --badge-high-text: #b91c1c;
      --badge-med-bg: #fef3c7;
      --badge-med-text: #b45309;
      --badge-low-bg: #d1fae5;
      --badge-low-text: #047857;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }

    [data-theme="dark"] {
      --primary: #3b82f6;
      --primary-dark: #60a5fa;
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-bg-subtle: #182238;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --text-heading: #f8fafc;
      --border: #263352;
      --card-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
      --selected-bg: rgba(59, 130, 246, 0.2);
      --selected-border: #3b82f6;
      --selected-text: #93c5fd;
      --permission-bg: rgba(37, 99, 235, 0.15);
      --permission-border: #3b82f6;
      --permission-text: #bfdbfe;
      --chart-grid: #263352;
      --chart-tick: #94a3b8;
      --badge-high-bg: rgba(239, 68, 68, 0.2);
      --badge-high-text: #fca5a5;
      --badge-med-bg: rgba(245, 158, 11, 0.2);
      --badge-med-text: #fcd34d;
      --badge-low-bg: rgba(16, 185, 129, 0.2);
      --badge-low-text: #86efac;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 12px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .container {
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .step-counter {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .theme-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      user-select: none;
    }

    .theme-toggle-btn:hover {
      border-color: var(--primary);
    }

    .progress-bar-container {
      background: var(--border);
      height: 6px;
      border-radius: 999px;
      margin-bottom: 2rem;
      overflow: hidden;
    }

    .progress-bar {
      background: var(--primary);
      height: 100%;
      width: 4%;
      transition: width 0.35s ease;
    }

    .wizard-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      border: 1px solid var(--border);
      box-shadow: var(--card-shadow);
      position: relative;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .fade-anim {
      animation: slideFade 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideFade {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .q-number-pill {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      margin-bottom: 0.75rem;
    }

    .q-statement {
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text-heading);
      line-height: 1.45;
      margin-bottom: 2rem;
    }

    @media (max-width: 600px) {
      .wizard-card {
        padding: 1.75rem 1.25rem;
      }
      .q-statement {
        font-size: 1.15rem;
        margin-bottom: 1.5rem;
      }
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 640px) {
      .options-grid {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }
    }

    .option-btn {
      position: relative;
    }

    .option-btn input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .option-btn label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0.9rem 0.5rem;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      min-height: 76px;
      background: var(--card-bg);
      transition: all 0.15s ease;
      user-select: none;
    }

    .option-btn label:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .option-btn .val {
      font-weight: 800;
      font-size: 1.15rem;
      margin-bottom: 4px;
      color: var(--text-heading);
    }

    .option-btn input:checked + label,
    .option-btn.selected label {
      background: var(--selected-bg);
      border-color: var(--selected-border);
      color: var(--selected-text);
      transform: scale(0.98);
    }

    .option-btn input:checked + label .val,
    .option-btn.selected label .val {
      color: var(--primary);
    }

    .wizard-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      border-top: 1px solid var(--border);
      padding-top: 1.25rem;
    }

    .btn-back {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-back:hover {
      color: var(--text-heading);
      background: var(--border);
    }

    .btn-back:disabled {
      visibility: hidden;
    }

    .hint-text {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Results Section */
    #results-section {
      display: none;
      animation: slideFade 0.4s ease-out;
    }

    header.results-header {
      text-align: center;
      margin-bottom: 2rem;
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border);
    }

    header.results-header h1 {
      font-size: 1.85rem;
      margin-bottom: 0.5rem;
      color: var(--text-heading);
    }

    header.results-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .chart-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 2rem;
      border: 1px solid var(--border);
      margin-bottom: 2rem;
      box-shadow: var(--card-shadow);
    }

    .chart-container {
      position: relative;
      height: 380px;
      width: 100%;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .antreiber-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 1.5rem;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      box-shadow: var(--card-shadow);
    }

    .antreiber-card.high {
      border-left: 6px solid var(--danger);
    }

    .antreiber-card.medium {
      border-left: 6px solid var(--warning);
    }

    .antreiber-card.low {
      border-left: 6px solid var(--success);
    }

    .card-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .badge {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
    }

    .badge-high { background: var(--badge-high-bg); color: var(--badge-high-text); }
    .badge-medium { background: var(--badge-med-bg); color: var(--badge-med-text); }
    .badge-low { background: var(--badge-low-bg); color: var(--badge-low-text); }

    .permission-box {
      background: var(--permission-bg);
      border-left: 4px solid var(--permission-border);
      padding: 0.85rem 1.1rem;
      margin: 1rem 0;
      border-radius: 0 8px 8px 0;
      font-style: italic;
      color: var(--permission-text);
    }

    .meta-box {
      font-size: 0.9rem;
      margin-top: 0.6rem;
      color: var(--text-muted);
    }

    .meta-box strong {
      color: var(--text-heading);
    }

    .btn-restart {
      background: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.85rem 2rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      margin: 2.5rem auto 1rem;
      display: block;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .btn-restart:hover {
      background: var(--primary-dark);
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Nav / Toolbar -->
  <div class="nav-bar">
    <div class="step-counter" id="stepCounter">Frage 1 von 25</div>
    <button class="theme-toggle-btn" id="themeToggle" type="button" aria-label="Dark Mode umschalten">
      <span id="themeIcon">🌙</span>
      <span id="themeLabel">Dark Mode</span>
    </button>
  </div>

  <div class="progress-bar-container" id="progressBarWrapper">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <!-- Schritt-für-Schritt Wizard -->
  <div id="survey-section">
    <div class="wizard-card fade-anim" id="wizardCard">
      <div>
        <span class="q-number-pill" id="questionPill">Aussage 1</span>
        <h2 class="q-statement" id="questionStatement">Lade Frage...</h2>

        <div class="options-grid" id="optionsGrid"></div>
      </div>

      <div class="wizard-actions">
        <button class="btn-back" id="btnBack" type="button" onclick="previousQuestion()">
          ← Zurück
        </button>
        <span class="hint-text">Tippe einfach auf deine Antwort</span>
      </div>
    </div>
  </div>

  <!-- Auswertungsansicht (automatisch nach Q25) -->
  <div id="results-section">
    <header class="results-header">
      <h1>Dein Antreiber-Profil</h1>
      <p>Hier ist die visuelle und inhaltliche Auswertung deiner fünf inneren Antreiber nach der Transaktionsanalyse.</p>
    </header>

    <div class="chart-card">
      <h2 style="font-size: 1.15rem; margin-bottom: 1rem; color: var(--text-heading);">Ergebnisübersicht (Punkte von 5 bis 25)</h2>
      <div class="chart-container">
        <canvas id="antreiberChart"></canvas>
      </div>
    </div>

    <div class="details-grid" id="detailsGrid"></div>

    <button class="btn-restart" onclick="restartTest()">Test wiederholen</button>
  </div>

</div>

<script>
  // --- Dark Mode ---
  const themeToggle = document.getElementById("themeToggle");
  const themeIcon = document.getElementById("themeIcon");
  const themeLabel = document.getElementById("themeLabel");
  let chartInstance = null;
  let computedScores = null;

  function initTheme() {
    const saved = localStorage.getItem("theme");
    const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    applyTheme(saved || (sysDark ? "dark" : "light"));
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("theme", theme);
    if (theme === "dark") {
      themeIcon.textContent = "☀️";
      themeLabel.textContent = "Light Mode";
    } else {
      themeIcon.textContent = "🌙";
      themeLabel.textContent = "Dark Mode";
    }
    if (chartInstance && computedScores) {
      renderChart(computedScores);
    }
  }

  themeToggle.addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
  });
  initTheme();

  // --- 25 Fragen & Metadaten ---
  const items = [
    { id: 1, text: "Wenn ich eine Arbeit mache, dann mache ich sie gründlich und fehlerfrei.", category: "PERFEKT" },
    { id: 2, text: "Ich werde ungeduldig, wenn jemand langsam spricht oder trödelt.", category: "SCHNELL" },
    { id: 3, text: "Es fällt mir schwer, eine Bitte abzuschlagen oder Nein zu sagen.", category: "RECHT" },
    { id: 4, text: "Ich ziehe Dinge auch dann durch, wenn sie sehr anstrengend oder mühsam sind.", category: "STRENG_AN" },
    { id: 5, text: "Eigene Schwächen oder Gefühle zeige ich vor anderen nur sehr ungern.", category: "STARK" },
    { id: 6, text: "Ich habe oft das Gefühl, dass mir die Zeit davonläuft und ich mich beeilen muss.", category: "SCHNELL" },
    { id: 7, text: "Ich kontrolliere Unterlagen oder Ergebnisse lieber noch ein weiteres Mal, um sicherzugehen.", category: "PERFEKT" },
    { id: 8, text: "Ich spüre schnell, was andere von mir erwarten, und versuche dem zu entsprechen.", category: "RECHT" },
    { id: 9, text: "Ich mache persönliche Probleme am liebsten ganz allein mit mir aus.", category: "STARK" },
    { id: 10, text: "Ein Erfolg zählt für mich erst dann richtig, wenn man hart dafür gekämpft hat.", category: "STRENG_AN" },
    { id: 11, text: "Es fällt mir schwer, Leerlauf auszuhalten; ich muss immer etwas Produktives tun.", category: "SCHNELL" },
    { id: 12, text: "Mir ist wichtig, dass alle in einer Gruppe zufrieden sind, auch wenn ich dafür zurückstecke.", category: "RECHT" },
    { id: 13, text: "Bei meinen Aufgaben lege ich die Messlatte für Qualität extrem hoch an.", category: "PERFEKT" },
    { id: 14, text: "Ich beiße die Zähne zusammen und funktioniere weiter, auch wenn ich erschöpft bin.", category: "STARK" },
    { id: 15, text: "Wenn mir etwas zu leicht fällt, habe ich das Gefühl, dass es noch nicht gut genug ist.", category: "STRENG_AN" },
    { id: 16, text: "Ich unterbreche andere im Gespräch manchmal oder vollende deren Sätze im Kopf.", category: "SCHNELL" },
    { id: 17, text: "Wenn Fehler passieren, ärgere ich mich maßlos über meine eigene Unachtsamkeit.", category: "PERFEKT" },
    { id: 18, text: "Kritik an meiner Arbeit nehme ich oft sehr persönlich und mache mir Vorwürfe.", category: "RECHT" },
    { id: 19, text: "Um Hilfe zu bitten, fällt mir schwer, weil ich niemandem zur Last fallen möchte.", category: "STARK" },
    { id: 20, text: "Ich starte oft viele Dinge gleichzeitig und setze mich selbst unter Zeitdruck.", category: "SCHNELL" },
    { id: 21, text: "Halbe Sachen oder 80%-Lösungen sind für mich unbefriedigend und inakzeptabel.", category: "PERFEKT" },
    { id: 22, text: "Selbst bei Routinetätigkeiten neige ich dazu, den komplizierten, mühsameren Weg zu wählen.", category: "STRENG_AN" },
    { id: 23, text: "Ich versuche Konflikte und Meinungsverschiedenheiten um jeden Preis zu vermeiden.", category: "RECHT" },
    { id: 24, text: "Ich zeige nach außen hin Gelassenheit und Härte, selbst wenn es mir innerlich nicht gut geht.", category: "STARK" },
    { id: 25, text: "Ich gebe selten auf, selbst wenn ein Projekt bereits zur zähen Qual geworden ist.", category: "STRENG_AN" }
  ];

  const antreiberMeta = {
    PERFEKT: {
      name: "Sei perfekt!",
      color: "#3b82f6",
      erlauber: "„Ich bin wertvoll und gut genug, so wie ich bin – auch wenn Fehler passieren. 80 % reichen oft völlig aus.“",
      staerken: "Hohe Sorgfalt, Gewissenhaftigkeit, Qualitätsbewusstsein, präzise Arbeitsweise.",
      risiken: "Detailverliebtheit, Verzögerungen, Delegationsschwierigkeiten, hoher Selbstoptimierungsdruck.",
      tipp: "Setze dir feste Deadlines und übe bewusst das 'Gut-Genug'-Prinzip."
    },
    SCHNELL: {
      name: "Mach schnell!",
      color: "#f59e0b",
      erlauber: "„Ich darf mir Zeit nehmen, Tempo herausnehmen und Pausen machen. Gründlichkeit geht vor Hast.“",
      staerken: "Hohes Arbeitstempo, Entschlusskraft, Agilität, effiziente Krisenbewältigung.",
      risiken: "Flüchtigkeitsfehler, innere Rastlosigkeit, Ungeduld mit Teammitgliedern, Atemlosigkeit.",
      tipp: "Plane zwischen Terminen 10 Minuten echte Pufferzeit ohne Bildschirm ein."
    },
    RECHT: {
      name: "Mach es recht!",
      color: "#ec4899",
      erlauber: "„Ich darf meine eigenen Bedürfnisse wichtig nehmen und Nein sagen. Ein Nein zu anderen ist ein Ja zu mir selbst.“",
      staerken: "Ausgeprägte Empathie, Hilfsbereitschaft, Teamorientierung, gutes Gespür für Stimmungen.",
      risiken: "Schwierigkeiten bei der Abgrenzung, Überlastung durch fremde Aufgaben, Konfliktscheue.",
      tipp: "Erbitten Sie sich bei Anfragen stets 24 Stunden Bedenkzeit, bevor du zusagst."
    },
    STRENG_AN: {
      name: "Streng dich an!",
      color: "#8b5cf6",
      erlauber: "„Dinge dürfen leicht von der Hand gehen und Freude machen. Erfolg darf sich mühelos anfühlen.“",
      staerken: "Großes Durchhaltevermögen, Zähigkeit, hohes Engagement bei komplexen Aufgaben.",
      risiken: "Verkomplizieren einfacher Abläufe, Unfähigkeit Erfolge zu genießen, ständiges 'Kämpfen'.",
      tipp: "Frage dich vor jeder Aufgabe: 'Wie sähe die unkomplizierteste Lösung aus?'"
    },
    STARK: {
      name: "Sei stark!",
      color: "#10b981",
      erlauber: "„Ich darf Gefühle und Verletzlichkeit zeigen. Ich darf vertrauen und andere um Unterstützung bitten.“",
      staerken: "Hohe Belastbarkeit, Ruhe in Ausnahmesituationen, Unabhängigkeit, Krisenfestigkeit.",
      risiken: "Emotionale Distanz, Verbergen von Überlastung bis zum Zusammenbruch, Scheu vor Hilfe.",
      tipp: "Delegiere gezielt eine Aufgabe pro Woche oder sprich offen aus, wenn etwas belastend ist."
    }
  };

  const scaleLabels = [
    { val: 1, label: "Trifft gar nicht zu" },
    { val: 2, label: "Trifft wenig zu" },
    { val: 3, label: "Trifft teilweise zu" },
    { val: 4, label: "Trifft meistens zu" },
    { val: 5, label: "Trifft voll zu" }
  ];

  // --- Wizard State ---
  let currentIndex = 0;
  const answers = {}; // { questionId: value }
  let isTransitioning = false;

  const questionStatement = document.getElementById("questionStatement");
  const questionPill = document.getElementById("questionPill");
  const optionsGrid = document.getElementById("optionsGrid");
  const stepCounter = document.getElementById("stepCounter");
  const progressBar = document.getElementById("progressBar");
  const btnBack = document.getElementById("btnBack");
  const wizardCard = document.getElementById("wizardCard");

  function renderCurrentQuestion() {
    isTransitioning = false;
    const currentQ = items[currentIndex];

    // UI Updates
    stepCounter.textContent = `Frage ${currentIndex + 1} von ${items.length}`;
    questionPill.textContent = `Aussage ${currentIndex + 1} von ${items.length}`;
    questionStatement.textContent = currentQ.text;
    btnBack.disabled = currentIndex === 0;

    const progressPct = ((currentIndex + 1) / items.length) * 100;
    progressBar.style.width = `${progressPct}%`;

    // Animation reset
    wizardCard.classList.remove("fade-anim");
    void wizardCard.offsetWidth; // trigger reflow
    wizardCard.classList.add("fade-anim");

    // Options rendern
    optionsGrid.innerHTML = "";
    scaleLabels.forEach(opt => {
      const isSelected = answers[currentQ.id] === opt.val;
      const optDiv = document.createElement("div");
      optDiv.className = `option-btn ${isSelected ? "selected" : ""}`;

      optDiv.innerHTML = `
        <input type="radio" name="opt_current" id="opt_${opt.val}" value="${opt.val}" ${isSelected ? "checked" : ""}>
        <label for="opt_${opt.val}">
          <span class="val">${opt.val}</span>
          <span>${opt.label}</span>
        </label>
      `;

      optDiv.querySelector("input").addEventListener("change", () => {
        selectAnswer(currentQ.id, opt.val, optDiv);
      });

      optionsGrid.appendChild(optDiv);
    });
  }

  function selectAnswer(questionId, value, clickedEl) {
    if (isTransitioning) return;
    isTransitioning = true;

    answers[questionId] = value;

    // Visuelles Feedback
    optionsGrid.querySelectorAll(".option-btn").forEach(el => el.classList.remove("selected"));
    clickedEl.classList.add("selected");

    // Kurzer Delay (230ms) für haptisches Feedback, dann nächste Frage oder Finish
    setTimeout(() => {
      if (currentIndex < items.length - 1) {
        currentIndex++;
        renderCurrentQuestion();
      } else {
        finishSurvey();
      }
    }, 230);
  }

  window.previousQuestion = function() {
    if (currentIndex > 0 && !isTransitioning) {
      currentIndex--;
      renderCurrentQuestion();
    }
  };

  function finishSurvey() {
    // Scores summieren
    const scores = { PERFEKT: 0, SCHNELL: 0, RECHT: 0, STRENG_AN: 0, STARK: 0 };
    items.forEach(q => {
      scores[q.category] += (answers[q.id] || 0);
    });

    computedScores = scores;

    // Ansicht wechseln
    document.getElementById("survey-section").style.display = "none";
    document.getElementById("progressBarWrapper").style.display = "none";
    stepCounter.style.display = "none";
    document.getElementById("results-section").style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });

    renderChart(scores);
    renderDetails(scores);
  }

  window.restartTest = function() {
    for (let key in answers) delete answers[key];
    currentIndex = 0;
    computedScores = null;
    if (chartInstance) {
      chartInstance.destroy();
      chartInstance = null;
    }
    document.getElementById("results-section").style.display = "none";
    document.getElementById("survey-section").style.display = "block";
    document.getElementById("progressBarWrapper").style.display = "block";
    stepCounter.style.display = "block";
    renderCurrentQuestion();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  function getLevel(score) {
    if (score >= 19) return { key: "high", text: "Stark ausgeprägt (Stressfalle)", badgeClass: "badge-high" };
    if (score >= 13) return { key: "medium", text: "Moderat (Gesunde Ressource)", badgeClass: "badge-medium" };
    return { key: "low", text: "Gering ausgeprägt", badgeClass: "badge-low" };
  }

  function renderChart(scores) {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    const gridColor = isDark ? "#263352" : "#f1f5f9";
    const tickColor = isDark ? "#94a3b8" : "#64748b";

    const ctx = document.getElementById("antreiberChart").getContext("2d");
    const labels = Object.keys(scores).map(key => antreiberMeta[key].name);
    const dataValues = Object.keys(scores).map(key => scores[key]);
    const bgColors = Object.keys(scores).map(key => antreiberMeta[key].color);

    if (chartInstance) {
      chartInstance.destroy();
    }

    chartInstance = new Chart(ctx, {
      type: "bar",
      data: {
        labels: labels,
        datasets: [{
          label: "Erreichte Punkte (5 - 25)",
          data: dataValues,
          backgroundColor: bgColors,
          borderRadius: 8,
          borderSkipped: false
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            min: 0,
            max: 25,
            ticks: { stepSize: 5, color: tickColor },
            grid: { color: gridColor }
          },
          x: {
            ticks: { color: tickColor, font: { weight: '600' } },
            grid: { display: false }
          }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              afterLabel: function(context) {
                return getLevel(context.raw).text;
              }
            }
          }
        }
      }
    });
  }

  function renderDetails(scores) {
    const grid = document.getElementById("detailsGrid");
    grid.innerHTML = "";

    const sortedKeys = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);

    sortedKeys.forEach(key => {
      const score = scores[key];
      const meta = antreiberMeta[key];
      const level = getLevel(score);

      const card = document.createElement("div");
      card.className = `antreiber-card ${level.key}`;
      card.innerHTML = `
        <div class="card-header-flex">
          <div class="card-title" style="color: ${meta.color}">${meta.name}</div>
          <div>
            <span style="font-weight: bold; font-size: 1.15rem; margin-right: 8px;">${score} / 25</span>
            <span class="badge ${level.badgeClass}">${level.text}</span>
          </div>
        </div>
        
        <div class="permission-box">
          <strong>Erlauber:</strong> ${meta.erlauber}
        </div>

        <div class="meta-box">
          <strong>Stärken als Ressource:</strong> ${meta.staerken}
        </div>
        <div class="meta-box">
          <strong>Risiko unter Druck:</strong> ${meta.risiken}
        </div>
        <div class="meta-box" style="margin-top: 0.5rem; color: var(--text-heading);">
          <strong>Konkreter Impuls:</strong> ${meta.tipp}
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // Initialer Start
  renderCurrentQuestion();
</script>

</body>
</html>
